name: Deploy Pages

# Deploys the static site to GitHub Pages on every push to main, stamping the
# "updated <month> <year>" text in index.html with the date of the commit
# actually being deployed, so it never goes stale.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; new pushes cancel an in-flight run
# rather than queueing behind it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stamp "updated <month> <year>" in terminal.html
        run: |
          set -euo pipefail
          STAMP=$(git log -1 --format=%cd --date=format:'%B %Y' | tr '[:upper:]' '[:lower:]')
          # terminal.html is the file that carries the rolling "updated <month>
          # <year>" stamp. index.html is a dated snapshot document: its footer
          # date is deliberately static and must NOT be rewritten here.
          if grep -qE 'updated [a-z]+ [0-9]{4}' terminal.html; then
            echo "Stamping terminal.html with: updated ${STAMP}"
            # Matches "updated <month> <year>" regardless of which month/year
            # is currently baked in, so this keeps working forever.
            sed -i -E "s/updated [a-z]+ [0-9]{4}/updated ${STAMP}/" terminal.html
            grep -n "updated ${STAMP}" terminal.html
          else
            echo "No 'updated <month> <year>' pattern in terminal.html; skipping stamp."
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare site directory
        run: |
          set -euo pipefail
          mkdir -p _site
          # Explicit allowlist: only these files are published. Everything the
          # site links to (index.html, llms.txt, sitemap.xml) must appear here.
          cp index.html terminal.html 404.html og.png CNAME concept-5-ssh.html lab-health.js _site/
          cp burn.html burn.json llms.txt robots.txt sitemap.xml _site/
          cp index.md about.md projects.md now.md contact.md burn.md _site/
          cp -R data docs about contact privacy _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
