name: Site checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static and data contracts
        run: |
          python3 tests/test_agent_readiness.py
          python3 tests/test_release_contract.py
          python3 tests/test_refresh_lab.py
          node --test tests/lab-health.test.js
      - name: Browser checks
        run: |
          node tests/homepage-browser.mjs
          node tests/burn-browser.mjs
        env:
          CHROME_BIN: /usr/bin/google-chrome
