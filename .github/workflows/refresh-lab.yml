name: Refresh George Lab

# Manual only: the site changes when George runs this or pushes to main himself.
on:
  workflow_dispatch:
    inputs:
      project:
        description: Optional project id that caused the refresh
        required: false
        type: string

permissions:
  actions: write
  contents: write

concurrency:
  group: refresh-george-lab
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Refresh snapshot
        env:
          GH_TOKEN: ${{ secrets.LAB_GITHUB_TOKEN }}
          EVENT_PROJECT: ${{ inputs.project }}
        run: |
          set -euo pipefail
          args=()
          if [[ -n "$EVENT_PROJECT" ]]; then args+=(--project "$EVENT_PROJECT"); fi
          python3 scripts/refresh-lab.py "${args[@]}"

      - name: Commit changed snapshot
        id: snapshot
        run: |
          set -euo pipefail
          if git diff --quiet -- data/lab-projects.json; then
            echo "George Lab snapshot is already current."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lab-projects.json
          git commit -m "chore(lab): refresh project metadata"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy changed snapshot through existing Pages workflow
        if: steps.snapshot.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
