# nginx content negotiation for georgenijo.com — acceptmarkdown.com protocol.
#
# Serves the .md sibling of any page when the client sends
# Accept: text/markdown, with Vary: Accept so caches never mix variants.
#
# The live origin is GitHub Pages, which cannot run this file. It is meant
# for the whoop-vm nginx (the origin that already cron-pulls this repo)
# if/when DNS moves off Pages, or any other static root serving this repo.
#
# Install: drop into /etc/nginx/conf.d/ inside the georgenijo.com server
# block (map must live at http level; the rest merges into server/location).

# Map the Accept header to a file extension we'll try first.
map $http_accept $preferred_ext {
    default                 ".html";
    "~*text/markdown"       ".md";
}

server {
    listen 443 ssl http2;
    server_name georgenijo.com;
    root /var/www/georgenijo.com;

    # Always tell caches the response depends on Accept.
    add_header Vary Accept always;

    location / {
        # Preferred extension first (sibling layout, then directory-index),
        # then fall back to HTML so markdown-speakers degrade gracefully.
        try_files $uri$preferred_ext $uri/index$preferred_ext $uri.html $uri/index.html =404;
    }

    # Set Content-Type explicitly for .md (nginx doesn't know it).
    location ~* \.md$ {
        default_type text/markdown;
        charset utf-8;
        add_header Vary Accept always;
    }

    error_page 404 /404.html;
}
